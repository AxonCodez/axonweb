<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Admin Dashboard — Axon</title>
  <link href="https://fonts.googleapis.com/css2?family=Fira+Code:wght@400;500;600;700&family=Inter:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
  <style>
    :root {
      --bg: #0a1628;
      --bg-card: #111d33;
      --bg-input: #0d1a2d;
      --border: rgba(92, 158, 255, 0.2);
      --border-hover: rgba(92, 158, 255, 0.5);
      --accent: #5c9eff;
      --accent-glow: rgba(92, 158, 255, 0.3);
      --text: #e4eaf5;
      --text-dim: #7a8ba8;
      --danger: #ff4d6a;
      --danger-hover: #ff2d4e;
      --success: #34d399;
      --radius: 14px;
      --radius-sm: 8px;
    }

    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      font-family: 'Inter', sans-serif;
      background: var(--bg);
      color: var(--text);
      min-height: 100vh;
      overflow-x: hidden;
    }

    /* === LOGIN SCREEN === */
    .login-overlay {
      position: fixed;
      inset: 0;
      background: var(--bg);
      display: flex;
      justify-content: center;
      align-items: center;
      z-index: 9999;
      transition: opacity 0.5s ease, visibility 0.5s ease;
    }

    .login-overlay.hidden {
      opacity: 0;
      visibility: hidden;
      pointer-events: none;
    }

    .login-box {
      background: var(--bg-card);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      padding: 48px 40px;
      width: 420px;
      max-width: 90%;
      text-align: center;
      box-shadow: 0 20px 60px rgba(0, 0, 0, 0.4);
    }

    .login-box h1 {
      font-family: 'Fira Code', monospace;
      font-size: 28px;
      font-weight: 700;
      margin-bottom: 8px;
      letter-spacing: 2px;
      background: linear-gradient(135deg, var(--accent), #a78bfa);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
    }

    .login-box p {
      color: var(--text-dim);
      font-size: 14px;
      margin-bottom: 32px;
    }

    .login-box input {
      width: 100%;
      padding: 14px 18px;
      background: var(--bg-input);
      border: 1px solid var(--border);
      border-radius: var(--radius-sm);
      color: var(--text);
      font-family: 'Fira Code', monospace;
      font-size: 15px;
      outline: none;
      transition: border-color 0.3s;
      margin-bottom: 16px;
    }

    .login-box input:focus {
      border-color: var(--accent);
      box-shadow: 0 0 0 3px var(--accent-glow);
    }

    .login-box button {
      width: 100%;
      padding: 14px;
      background: var(--accent);
      border: none;
      border-radius: var(--radius-sm);
      color: #fff;
      font-size: 15px;
      font-weight: 600;
      cursor: pointer;
      transition: background 0.3s, transform 0.2s;
    }

    .login-box button:hover {
      background: #4a8ae6;
      transform: translateY(-1px);
    }

    .login-error {
      color: var(--danger);
      font-size: 13px;
      margin-top: 12px;
      display: none;
    }

    /* === DASHBOARD LAYOUT === */
    .dashboard {
      display: none;
    }

    .dashboard.active {
      display: block;
    }

    /* Top bar */
    .topbar {
      position: sticky;
      top: 0;
      background: rgba(10, 22, 40, 0.9);
      backdrop-filter: blur(16px);
      border-bottom: 1px solid var(--border);
      padding: 16px 32px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      z-index: 100;
    }

    .topbar-left {
      display: flex;
      align-items: center;
      gap: 16px;
    }

    .topbar-logo {
      font-family: 'Fira Code', monospace;
      font-size: 20px;
      font-weight: 700;
      letter-spacing: 3px;
      background: linear-gradient(135deg, var(--accent), #a78bfa);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
    }

    .topbar-badge {
      background: rgba(92, 158, 255, 0.15);
      border: 1px solid var(--border);
      padding: 4px 12px;
      border-radius: 20px;
      font-size: 11px;
      color: var(--accent);
      font-weight: 600;
      letter-spacing: 1px;
      text-transform: uppercase;
    }

    .btn-logout {
      padding: 8px 20px;
      background: transparent;
      border: 1px solid var(--border);
      border-radius: var(--radius-sm);
      color: var(--text-dim);
      font-size: 13px;
      cursor: pointer;
      transition: all 0.3s;
    }

    .btn-logout:hover {
      border-color: var(--danger);
      color: var(--danger);
    }

    /* Main content */
    .main {
      max-width: 1200px;
      margin: 0 auto;
      padding: 32px;
    }

    /* Tabs */
    .tabs {
      display: flex;
      gap: 8px;
      margin-bottom: 32px;
      border-bottom: 1px solid var(--border);
      padding-bottom: 16px;
    }

    .tab-btn {
      padding: 10px 24px;
      background: transparent;
      border: 1px solid transparent;
      border-radius: var(--radius-sm);
      color: var(--text-dim);
      font-size: 14px;
      font-weight: 500;
      cursor: pointer;
      transition: all 0.3s;
      font-family: 'Inter', sans-serif;
    }

    .tab-btn:hover {
      color: var(--text);
      background: rgba(92, 158, 255, 0.05);
    }

    .tab-btn.active {
      background: rgba(92, 158, 255, 0.12);
      border-color: var(--border);
      color: var(--accent);
      font-weight: 600;
    }

    .tab-content {
      display: none;
      animation: fadeIn 0.4s ease;
    }

    .tab-content.active {
      display: block;
    }

    @keyframes fadeIn {
      from { opacity: 0; transform: translateY(8px); }
      to { opacity: 1; transform: translateY(0); }
    }

    /* Section headers */
    .section-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 24px;
    }

    .section-header h2 {
      font-size: 22px;
      font-weight: 700;
    }

    .section-header h2 span {
      color: var(--accent);
    }

    /* Buttons */
    .btn {
      padding: 10px 20px;
      border: none;
      border-radius: var(--radius-sm);
      font-size: 13px;
      font-weight: 600;
      cursor: pointer;
      transition: all 0.25s;
      display: inline-flex;
      align-items: center;
      gap: 8px;
      font-family: 'Inter', sans-serif;
    }

    .btn-primary {
      background: var(--accent);
      color: #fff;
    }

    .btn-primary:hover {
      background: #4a8ae6;
      transform: translateY(-1px);
      box-shadow: 0 4px 16px var(--accent-glow);
    }

    .btn-danger {
      background: transparent;
      border: 1px solid rgba(255, 77, 106, 0.3);
      color: var(--danger);
      padding: 6px 14px;
      font-size: 12px;
    }

    .btn-danger:hover {
      background: rgba(255, 77, 106, 0.1);
      border-color: var(--danger);
    }

    .btn-ghost {
      background: rgba(92, 158, 255, 0.1);
      border: 1px solid var(--border);
      color: var(--accent);
    }

    .btn-ghost:hover {
      background: rgba(92, 158, 255, 0.2);
      border-color: var(--accent);
    }

    /* === PROJECTS TABLE === */
    .projects-table {
      width: 100%;
      border-collapse: separate;
      border-spacing: 0;
      border: 1px solid var(--border);
      border-radius: var(--radius);
      overflow: hidden;
    }

    .projects-table th {
      background: rgba(92, 158, 255, 0.06);
      padding: 14px 20px;
      text-align: left;
      font-size: 12px;
      font-weight: 600;
      color: var(--text-dim);
      text-transform: uppercase;
      letter-spacing: 1px;
      border-bottom: 1px solid var(--border);
    }

    .projects-table td {
      padding: 14px 20px;
      border-bottom: 1px solid var(--border);
      font-size: 14px;
      vertical-align: middle;
    }

    .projects-table tr:last-child td {
      border-bottom: none;
    }

    .projects-table tr:hover td {
      background: rgba(92, 158, 255, 0.03);
    }

    .project-name {
      font-weight: 600;
      color: var(--text);
    }

    .project-url {
      color: var(--accent);
      text-decoration: none;
      font-family: 'Fira Code', monospace;
      font-size: 12px;
      word-break: break-all;
    }

    .project-url:hover {
      text-decoration: underline;
    }

    .actions {
      display: flex;
      gap: 8px;
    }

    .btn-icon {
      padding: 6px 10px;
      background: transparent;
      border: 1px solid var(--border);
      border-radius: 6px;
      color: var(--text-dim);
      cursor: pointer;
      font-size: 14px;
      transition: all 0.2s;
    }

    .btn-icon:hover {
      border-color: var(--accent);
      color: var(--accent);
      background: rgba(92, 158, 255, 0.1);
    }

    .btn-icon.delete:hover {
      border-color: var(--danger);
      color: var(--danger);
      background: rgba(255, 77, 106, 0.1);
    }

    /* === MODALS === */
    .modal-overlay {
      position: fixed;
      inset: 0;
      background: rgba(0, 0, 0, 0.6);
      backdrop-filter: blur(4px);
      display: none;
      justify-content: center;
      align-items: center;
      z-index: 9000;
    }

    .modal-overlay.show {
      display: flex;
    }

    .modal {
      background: var(--bg-card);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      padding: 32px;
      width: 480px;
      max-width: 90%;
      box-shadow: 0 20px 60px rgba(0, 0, 0, 0.4);
      animation: modalIn 0.3s ease;
    }

    @keyframes modalIn {
      from { opacity: 0; transform: scale(0.95) translateY(10px); }
      to { opacity: 1; transform: scale(1) translateY(0); }
    }

    .modal h3 {
      font-size: 18px;
      margin-bottom: 24px;
      display: flex;
      align-items: center;
      gap: 10px;
    }

    .modal h3 .icon {
      font-size: 22px;
    }

    .form-group {
      margin-bottom: 18px;
    }

    .form-group label {
      display: block;
      font-size: 12px;
      font-weight: 600;
      color: var(--text-dim);
      text-transform: uppercase;
      letter-spacing: 0.5px;
      margin-bottom: 8px;
    }

    .form-group input,
    .form-group select,
    .form-group textarea {
      width: 100%;
      padding: 12px 16px;
      background: var(--bg-input);
      border: 1px solid var(--border);
      border-radius: var(--radius-sm);
      color: var(--text);
      font-size: 14px;
      font-family: 'Inter', sans-serif;
      outline: none;
      transition: border-color 0.3s;
    }

    .form-group textarea {
      resize: vertical;
      min-height: 80px;
    }

    .form-group input:focus,
    .form-group select:focus,
    .form-group textarea:focus {
      border-color: var(--accent);
      box-shadow: 0 0 0 3px var(--accent-glow);
    }

    .form-group input[type="file"] {
      padding: 10px;
      cursor: pointer;
    }

    .modal-actions {
      display: flex;
      justify-content: flex-end;
      gap: 10px;
      margin-top: 24px;
    }

    .btn-cancel {
      padding: 10px 20px;
      background: transparent;
      border: 1px solid var(--border);
      border-radius: var(--radius-sm);
      color: var(--text-dim);
      cursor: pointer;
      font-size: 13px;
      transition: all 0.3s;
    }

    .btn-cancel:hover {
      border-color: var(--text-dim);
      color: var(--text);
    }

    /* === GRAPHICS SECTION === */
    .category-tabs {
      display: flex;
      gap: 8px;
      flex-wrap: wrap;
      margin-bottom: 24px;
    }

    .cat-btn {
      padding: 8px 18px;
      background: rgba(92, 158, 255, 0.08);
      border: 1px solid var(--border);
      border-radius: 20px;
      color: var(--text-dim);
      font-size: 13px;
      cursor: pointer;
      transition: all 0.3s;
      font-family: 'Inter', sans-serif;
      text-transform: capitalize;
    }

    .cat-btn:hover {
      border-color: var(--accent);
      color: var(--text);
    }

    .cat-btn.active {
      background: rgba(92, 158, 255, 0.18);
      border-color: var(--accent);
      color: var(--accent);
      font-weight: 600;
    }

    .cat-btn.add-cat {
      border-style: dashed;
      color: var(--accent);
    }

    .graphics-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(200px, 1fr));
      gap: 16px;
    }

    .graphic-item {
      position: relative;
      border-radius: var(--radius-sm);
      overflow: hidden;
      border: 1px solid var(--border);
      background: var(--bg-input);
      transition: border-color 0.3s, transform 0.3s;
      cursor: pointer;
      aspect-ratio: 16/10;
    }

    .graphic-item:hover {
      border-color: var(--accent);
      transform: translateY(-2px);
    }

    .graphic-item img {
      width: 100%;
      height: 100%;
      object-fit: cover;
      display: block;
    }

    .graphic-item .delete-overlay {
      position: absolute;
      inset: 0;
      background: rgba(0, 0, 0, 0.7);
      display: flex;
      justify-content: center;
      align-items: center;
      opacity: 0;
      transition: opacity 0.3s;
    }

    .graphic-item:hover .delete-overlay {
      opacity: 1;
    }

    .delete-overlay button {
      padding: 8px 16px;
      background: var(--danger);
      border: none;
      border-radius: var(--radius-sm);
      color: #fff;
      font-size: 12px;
      font-weight: 600;
      cursor: pointer;
      transition: background 0.2s;
    }

    .delete-overlay button:hover {
      background: var(--danger-hover);
    }

    .add-graphic-card {
      border: 2px dashed var(--border);
      border-radius: var(--radius-sm);
      display: flex;
      justify-content: center;
      align-items: center;
      flex-direction: column;
      gap: 8px;
      cursor: pointer;
      transition: border-color 0.3s, background 0.3s;
      aspect-ratio: 16/10;
      color: var(--text-dim);
      font-size: 13px;
    }

    .add-graphic-card:hover {
      border-color: var(--accent);
      background: rgba(92, 158, 255, 0.05);
      color: var(--accent);
    }

    .add-graphic-card .plus-icon {
      font-size: 32px;
      line-height: 1;
    }

    /* Upload type toggle */
    .upload-toggle {
      display: flex;
      gap: 4px;
      background: var(--bg-input);
      border-radius: var(--radius-sm);
      padding: 4px;
      margin-bottom: 16px;
    }

    .upload-toggle button {
      flex: 1;
      padding: 8px;
      background: transparent;
      border: none;
      border-radius: 6px;
      color: var(--text-dim);
      font-size: 13px;
      cursor: pointer;
      transition: all 0.2s;
      font-family: 'Inter', sans-serif;
    }

    .upload-toggle button.active {
      background: var(--accent);
      color: #fff;
      font-weight: 600;
    }

    /* Empty State */
    .empty-state {
      text-align: center;
      padding: 60px 20px;
      color: var(--text-dim);
    }

    .empty-state .icon {
      font-size: 48px;
      margin-bottom: 16px;
    }

    .empty-state h3 {
      font-size: 18px;
      margin-bottom: 8px;
      color: var(--text);
    }

    .empty-state p {
      font-size: 14px;
    }

    /* Toast notifications */
    .toast-container {
      position: fixed;
      bottom: 24px;
      right: 24px;
      z-index: 10000;
      display: flex;
      flex-direction: column;
      gap: 8px;
    }

    .toast {
      padding: 14px 20px;
      background: var(--bg-card);
      border: 1px solid var(--border);
      border-radius: var(--radius-sm);
      color: var(--text);
      font-size: 14px;
      box-shadow: 0 8px 24px rgba(0, 0, 0, 0.3);
      display: flex;
      align-items: center;
      gap: 10px;
      animation: slideIn 0.3s ease;
      min-width: 280px;
    }

    .toast.success { border-left: 3px solid var(--success); }
    .toast.error { border-left: 3px solid var(--danger); }

    @keyframes slideIn {
      from { opacity: 0; transform: translateX(40px); }
      to { opacity: 1; transform: translateX(0); }
    }

    /* Category delete button */
    .cat-delete {
      margin-left: 4px;
      font-size: 10px;
      opacity: 0;
      transition: opacity 0.2s;
      cursor: pointer;
    }

    .cat-btn:hover .cat-delete {
      opacity: 1;
    }

    /* Responsive */
    @media (max-width: 768px) {
      .main { padding: 16px; }
      .topbar { padding: 12px 16px; }
      .graphics-grid { grid-template-columns: repeat(auto-fill, minmax(150px, 1fr)); }
      .modal { padding: 24px; }
    }
  </style>
</head>
<body>

  <!-- LOGIN -->
  <div class="login-overlay" id="loginOverlay">
    <div class="login-box">
      <h1>AXON</h1>
      <p>Admin Dashboard — Enter your password to continue</p>
      <input type="password" id="loginPassword" placeholder="Password" autocomplete="off" />
      <button onclick="attemptLogin()">Sign In</button>
      <p class="login-error" id="loginError">Incorrect password. Try again.</p>
    </div>
  </div>

  <!-- DASHBOARD -->
  <div class="dashboard" id="dashboard">

    <!-- Top bar -->
    <div class="topbar">
      <div class="topbar-left">
        <div class="topbar-logo">AXON</div>
        <span class="topbar-badge">Admin</span>
      </div>
      <button class="btn-logout" onclick="logout()">Sign Out</button>
    </div>

    <!-- Main -->
    <div class="main">

      <!-- Tabs -->
      <div class="tabs">
        <button class="tab-btn active" data-tab="projects" onclick="switchTab('projects')">
          📁 Code & Development
        </button>
        <button class="tab-btn" data-tab="graphics" onclick="switchTab('graphics')">
          🎨 Graphics Designing
        </button>
      </div>

      <!-- PROJECTS TAB -->
      <div class="tab-content active" id="tab-projects">
        <div class="section-header">
          <h2>Code & <span>Development</span></h2>
          <button class="btn btn-primary" onclick="openProjectModal()">+ Add Project</button>
        </div>
        <div id="projectsList"></div>
      </div>

      <!-- GRAPHICS TAB -->
      <div class="tab-content" id="tab-graphics">
        <div class="section-header">
          <h2>Graphics <span>Designing</span></h2>
          <button class="btn btn-primary" onclick="openGraphicModal()">+ Add Image</button>
        </div>

        <div class="category-tabs" id="categoryTabs"></div>
        <div class="graphics-grid" id="graphicsGrid"></div>
      </div>

    </div>
  </div>

  <!-- PROJECT MODAL -->
  <div class="modal-overlay" id="projectModal">
    <div class="modal">
      <h3><span class="icon">📁</span> <span id="projectModalTitle">Add Project</span></h3>
      <div class="form-group">
        <label>Project Name</label>
        <input type="text" id="projName" placeholder="e.g. My Cool App" />
      </div>
      <div class="form-group">
        <label>URL</label>
        <input type="text" id="projUrl" placeholder="https://github.com/..." />
      </div>
      <div class="form-group">
        <label>Description (optional)</label>
        <input type="text" id="projDesc" placeholder="Brief description" />
      </div>
      <input type="hidden" id="projEditId" />
      <div class="modal-actions">
        <button class="btn-cancel" onclick="closeModal('projectModal')">Cancel</button>
        <button class="btn btn-primary" onclick="saveProject()">Save Project</button>
      </div>
    </div>
  </div>

  <!-- GRAPHIC MODAL -->
  <div class="modal-overlay" id="graphicModal">
    <div class="modal">
      <h3><span class="icon">🎨</span> Add Image</h3>

      <div class="form-group">
        <label>Category</label>
        <select id="gfxCategory"></select>
      </div>

      <div class="upload-toggle">
        <button class="active" onclick="setUploadType('url', this)">URL</button>
        <button onclick="setUploadType('file', this)">Upload File</button>
      </div>

      <div id="urlUpload">
        <div class="form-group">
          <label>Image URL</label>
          <input type="text" id="gfxUrl" placeholder="https://example.com/image.png" />
        </div>
      </div>

      <div id="fileUpload" style="display: none;">
        <div class="form-group">
          <label>Choose Image</label>
          <input type="file" id="gfxFile" accept="image/*" />
        </div>
      </div>

      <div class="modal-actions">
        <button class="btn-cancel" onclick="closeModal('graphicModal')">Cancel</button>
        <button class="btn btn-primary" onclick="saveGraphic()">Add Image</button>
      </div>
    </div>
  </div>

  <!-- CATEGORY MODAL -->
  <div class="modal-overlay" id="categoryModal">
    <div class="modal">
      <h3><span class="icon">📂</span> New Category</h3>
      <div class="form-group">
        <label>Category Name</label>
        <input type="text" id="newCatName" placeholder="e.g. Instagram Stories" />
      </div>
      <div class="modal-actions">
        <button class="btn-cancel" onclick="closeModal('categoryModal')">Cancel</button>
        <button class="btn btn-primary" onclick="addCategory()">Create Category</button>
      </div>
    </div>
  </div>

  <!-- TOASTS -->
  <div class="toast-container" id="toasts"></div>

  <script>
    let token = localStorage.getItem('axon-admin-token') || '';
    let currentCategory = '';
    let uploadType = 'url';

    // ========== AUTH ==========
    async function attemptLogin() {
      const password = document.getElementById('loginPassword').value;
      try {
        const res = await fetch('/api/auth/login', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ password })
        });
        const data = await res.json();
        if (data.success) {
          token = data.token;
          localStorage.setItem('axon-admin-token', token);
          showDashboard();
        } else {
          document.getElementById('loginError').style.display = 'block';
        }
      } catch (err) {
        toast('Connection error', 'error');
      }
    }

    // Enter key for login
    document.getElementById('loginPassword').addEventListener('keydown', e => {
      if (e.key === 'Enter') attemptLogin();
    });

    function logout() {
      token = '';
      localStorage.removeItem('axon-admin-token');
      document.getElementById('loginOverlay').classList.remove('hidden');
      document.getElementById('dashboard').classList.remove('active');
      document.getElementById('loginPassword').value = '';
      document.getElementById('loginError').style.display = 'none';
    }

    function showDashboard() {
      document.getElementById('loginOverlay').classList.add('hidden');
      document.getElementById('dashboard').classList.add('active');
      loadProjects();
      loadCategories();
    }

    // Check if already logged in
    if (token) {
      showDashboard();
    }

    // ========== TABS ==========
    function switchTab(tabName) {
      document.querySelectorAll('.tab-btn').forEach(b => b.classList.remove('active'));
      document.querySelectorAll('.tab-content').forEach(c => c.classList.remove('active'));
      document.querySelector(`[data-tab="${tabName}"]`).classList.add('active');
      document.getElementById(`tab-${tabName}`).classList.add('active');
    }

    // ========== PROJECTS ==========
    async function loadProjects() {
      try {
        const res = await fetch('/api/projects');
        const projects = await res.json();
        renderProjects(projects);
      } catch (err) {
        toast('Failed to load projects', 'error');
      }
    }

    function renderProjects(projects) {
      const container = document.getElementById('projectsList');
      if (!projects.length) {
        container.innerHTML = `
          <div class="empty-state">
            <div class="icon">📦</div>
            <h3>No projects yet</h3>
            <p>Click "Add Project" to get started.</p>
          </div>`;
        return;
      }

      container.innerHTML = `
        <table class="projects-table">
          <thead>
            <tr>
              <th>Name</th>
              <th>URL</th>
              <th>Description</th>
              <th>Actions</th>
            </tr>
          </thead>
          <tbody>
            ${projects.map(p => `
              <tr>
                <td class="project-name">${escHtml(p.name)}</td>
                <td><a href="${escHtml(p.url)}" target="_blank" class="project-url">${escHtml(p.url)}</a></td>
                <td style="color: var(--text-dim); font-size: 13px;">${escHtml(p.description || '—')}</td>
                <td>
                  <div class="actions">
                    <button class="btn-icon" onclick="editProject('${p.id}')" title="Edit">✏️</button>
                    <button class="btn-icon delete" onclick="deleteProject('${p.id}')" title="Delete">🗑️</button>
                  </div>
                </td>
              </tr>
            `).join('')}
          </tbody>
        </table>`;
    }

    function openProjectModal(project = null) {
      document.getElementById('projName').value = project?.name || '';
      document.getElementById('projUrl').value = project?.url || '';
      document.getElementById('projDesc').value = project?.description || '';
      document.getElementById('projEditId').value = project?.id || '';
      document.getElementById('projectModalTitle').textContent = project ? 'Edit Project' : 'Add Project';
      openModal('projectModal');
    }

    async function editProject(id) {
      const res = await fetch('/api/projects');
      const projects = await res.json();
      const project = projects.find(p => p.id === id);
      if (project) openProjectModal(project);
    }

    async function saveProject() {
      const name = document.getElementById('projName').value.trim();
      const url = document.getElementById('projUrl').value.trim();
      const description = document.getElementById('projDesc').value.trim();
      const editId = document.getElementById('projEditId').value;

      if (!name || !url) {
        toast('Name and URL are required', 'error');
        return;
      }

      try {
        const endpoint = editId ? `/api/projects/${editId}` : '/api/projects';
        const method = editId ? 'PUT' : 'POST';
        await fetch(endpoint, {
          method,
          headers: {
            'Content-Type': 'application/json',
            'X-Admin-Token': token
          },
          body: JSON.stringify({ name, url, description })
        });
        closeModal('projectModal');
        loadProjects();
        toast(editId ? 'Project updated!' : 'Project added!', 'success');
      } catch (err) {
        toast('Failed to save project', 'error');
      }
    }

    async function deleteProject(id) {
      if (!confirm('Delete this project?')) return;
      try {
        await fetch(`/api/projects/${id}`, {
          method: 'DELETE',
          headers: { 'X-Admin-Token': token }
        });
        loadProjects();
        toast('Project deleted', 'success');
      } catch (err) {
        toast('Failed to delete', 'error');
      }
    }

    // ========== GRAPHICS ==========
    async function loadCategories() {
      try {
        const res = await fetch('/api/graphics');
        const graphics = await res.json();
        const categories = Object.keys(graphics);
        renderCategoryTabs(categories);
        updateCategorySelect(categories);
        if (categories.length && !currentCategory) {
          currentCategory = categories[0];
        }
        if (currentCategory) {
          loadGraphics(currentCategory);
          // update active tab
          document.querySelectorAll('.cat-btn:not(.add-cat)').forEach(b => {
            b.classList.toggle('active', b.dataset.cat === currentCategory);
          });
        }
      } catch (err) {
        toast('Failed to load categories', 'error');
      }
    }

    function renderCategoryTabs(categories) {
      const container = document.getElementById('categoryTabs');
      const displayNames = {
        discord: 'Discord Banners',
        twitter: 'Twitter Headers',
        youtube: 'YouTube Banners',
        server: 'Server Banners',
        logo: 'Logos & PFPs'
      };

      container.innerHTML = categories.map(cat => `
        <button class="cat-btn ${cat === currentCategory ? 'active' : ''}" data-cat="${cat}" onclick="selectCategory('${cat}')">
          ${displayNames[cat] || cat.replace(/_/g, ' ')}
          <span class="cat-delete" onclick="event.stopPropagation(); deleteCategory('${cat}')" title="Delete category">✕</span>
        </button>
      `).join('') + `
        <button class="cat-btn add-cat" onclick="openModal('categoryModal')">+ New Category</button>
      `;
    }

    function updateCategorySelect(categories) {
      const select = document.getElementById('gfxCategory');
      const displayNames = {
        discord: 'Discord Banners',
        twitter: 'Twitter Headers',
        youtube: 'YouTube Banners',
        server: 'Server Banners',
        logo: 'Logos & PFPs'
      };
      select.innerHTML = categories.map(cat =>
        `<option value="${cat}" ${cat === currentCategory ? 'selected' : ''}>${displayNames[cat] || cat.replace(/_/g, ' ')}</option>`
      ).join('');
    }

    function selectCategory(cat) {
      currentCategory = cat;
      document.querySelectorAll('.cat-btn:not(.add-cat)').forEach(b => {
        b.classList.toggle('active', b.dataset.cat === cat);
      });
      loadGraphics(cat);
    }

    async function loadGraphics(category) {
      try {
        const res = await fetch(`/api/graphics/${category}`);
        const images = await res.json();
        renderGraphics(images, category);
      } catch (err) {
        toast('Failed to load images', 'error');
      }
    }

    function renderGraphics(images, category) {
      const container = document.getElementById('graphicsGrid');
      container.innerHTML = images.map((url, idx) => `
        <div class="graphic-item">
          <img src="${escHtml(url)}" alt="Graphic" loading="lazy" onerror="this.style.display='none'" />
          <div class="delete-overlay">
            <button onclick="deleteGraphic('${category}', ${idx})">🗑️ Remove</button>
          </div>
        </div>
      `).join('') + `
        <div class="add-graphic-card" onclick="openGraphicModal()">
          <div class="plus-icon">+</div>
          <span>Add Image</span>
        </div>
      `;
    }

    function openGraphicModal() {
      openModal('graphicModal');
      document.getElementById('gfxUrl').value = '';
      document.getElementById('gfxFile').value = '';
    }

    function setUploadType(type, btn) {
      uploadType = type;
      document.querySelectorAll('.upload-toggle button').forEach(b => b.classList.remove('active'));
      btn.classList.add('active');
      document.getElementById('urlUpload').style.display = type === 'url' ? 'block' : 'none';
      document.getElementById('fileUpload').style.display = type === 'file' ? 'block' : 'none';
    }

    async function saveGraphic() {
      const category = document.getElementById('gfxCategory').value;

      try {
        if (uploadType === 'url') {
          const url = document.getElementById('gfxUrl').value.trim();
          if (!url) { toast('URL is required', 'error'); return; }

          await fetch(`/api/graphics/${category}/url`, {
            method: 'POST',
            headers: {
              'Content-Type': 'application/json',
              'X-Admin-Token': token
            },
            body: JSON.stringify({ url })
          });
        } else {
          const file = document.getElementById('gfxFile').files[0];
          if (!file) { toast('Please choose a file', 'error'); return; }

          const formData = new FormData();
          formData.append('image', file);

          await fetch(`/api/graphics/${category}/upload`, {
            method: 'POST',
            headers: { 'X-Admin-Token': token },
            body: formData
          });
        }

        closeModal('graphicModal');
        currentCategory = category;
        loadCategories();
        toast('Image added!', 'success');
      } catch (err) {
        toast('Failed to add image', 'error');
      }
    }

    async function deleteGraphic(category, index) {
      if (!confirm('Remove this image?')) return;
      try {
        await fetch(`/api/graphics/${category}/${index}`, {
          method: 'DELETE',
          headers: { 'X-Admin-Token': token }
        });
        loadGraphics(category);
        toast('Image removed', 'success');
      } catch (err) {
        toast('Failed to remove', 'error');
      }
    }

    async function addCategory() {
      const name = document.getElementById('newCatName').value.trim();
      if (!name) { toast('Name is required', 'error'); return; }

      try {
        await fetch('/api/graphics-category', {
          method: 'POST',
          headers: {
            'Content-Type': 'application/json',
            'X-Admin-Token': token
          },
          body: JSON.stringify({ name })
        });
        document.getElementById('newCatName').value = '';
        closeModal('categoryModal');
        currentCategory = name.toLowerCase().replace(/\s+/g, '_');
        loadCategories();
        toast('Category created!', 'success');
      } catch (err) {
        toast('Failed to create category', 'error');
      }
    }

    async function deleteCategory(cat) {
      if (!confirm(`Delete category "${cat}" and all its images? This cannot be undone.`)) return;
      try {
        await fetch(`/api/graphics-category/${cat}`, {
          method: 'DELETE',
          headers: { 'X-Admin-Token': token }
        });
        if (currentCategory === cat) currentCategory = '';
        loadCategories();
        toast('Category deleted', 'success');
      } catch (err) {
        toast('Failed to delete category', 'error');
      }
    }

    // ========== MODALS ==========
    function openModal(id) {
      document.getElementById(id).classList.add('show');
    }

    function closeModal(id) {
      document.getElementById(id).classList.remove('show');
    }

    // Close modals on overlay click
    document.querySelectorAll('.modal-overlay').forEach(overlay => {
      overlay.addEventListener('click', e => {
        if (e.target === overlay) overlay.classList.remove('show');
      });
    });

    // ESC to close modals
    document.addEventListener('keydown', e => {
      if (e.key === 'Escape') {
        document.querySelectorAll('.modal-overlay.show').forEach(m => m.classList.remove('show'));
      }
    });

    // ========== UTILS ==========
    function escHtml(str) {
      const div = document.createElement('div');
      div.textContent = str;
      return div.innerHTML;
    }

    function toast(message, type = 'success') {
      const container = document.getElementById('toasts');
      const icon = type === 'success' ? '✅' : '❌';
      const el = document.createElement('div');
      el.className = `toast ${type}`;
      el.innerHTML = `<span>${icon}</span> ${escHtml(message)}`;
      container.appendChild(el);
      setTimeout(() => {
        el.style.opacity = '0';
        el.style.transform = 'translateX(40px)';
        el.style.transition = 'all 0.3s';
        setTimeout(() => el.remove(), 300);
      }, 3000);
    }
  </script>
</body>
</html>
